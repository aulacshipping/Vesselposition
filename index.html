<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="1200">
<title>Aulac Fleet Position</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
  :root{ --ink:#0f1a33; --ink-soft:#4a5a7a; --brand:#1a3d8f; --brand-deep:#122c6b; --surface:#ffffff; --surface-alt:#eef1f9; --surface-sunk:#e4e9f5; --line:#d7deee; --accent:#f5a623; --eta:#157a45; --eta-bg:#e4f4ea; --etd:#b8291f; --etd-bg:#fbe7e5; --arrived:#1d4fc4; --arrived-bg:#e6ecfc; --pob:#c0590c; --pob-bg:#fbecdd; --shadow: 0 1px 2px rgba(15,26,51,.04), 0 8px 24px -12px rgba(15,26,51,.14); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#eef2fb; --ink-soft:#a9b6d6; --brand:#7fa0ff; --brand-deep:#c4d4ff; --surface:#131c33; --surface-alt:#0d1426; --surface-sunk:#0a0f1e; --line:#26314f; --accent:#f5b74a; --eta:#4fd88a; --eta-bg:#123324; --etd:#ff8177; --etd-bg:#3a1512; --arrived:#8fb3ff; --arrived-bg:#101d3d; --pob:#ffab5c; --pob-bg:#3a2408; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6); } }
  *{box-sizing:border-box;} html,body{height:100%;} body{ margin:0; background:var(--surface-alt); color:var(--ink); font-family:'IBM Plex Sans', Arial, sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  
  header{ display:flex; align-items:center; justify-content:space-between; gap:20px; padding:12px 24px; background:var(--surface); border-bottom:1px solid var(--line); flex-shrink:0; }
  .brand{display:flex;align-items:center;gap:14px;} .brand svg{width:110px;height:auto;flex-shrink:0;} .brand-text{display:flex;flex-direction:column;line-height:1.05;} .brand-text .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:10px;font-weight:600;letter-spacing:.14em; color:var(--accent); text-transform:uppercase; margin-bottom:4px; } .brand-text .title{ font-family:'Archivo', sans-serif; font-weight:800; font-size:20px; color:var(--ink); text-wrap:balance; }
  
  .header-right{display:flex; align-items:center; gap:16px;} 
  #clock{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:16px; color:var(--ink); background:var(--surface-sunk); border:1px solid var(--line); padding:6px 12px; border-radius:8px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .live-pill{ display:flex; align-items:center; gap:8px; background:var(--eta-bg); color:var(--eta); font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px; letter-spacing:.06em; padding:6px 12px; border-radius:99px; } .live-dot{width:8px;height:8px;border-radius:50%;background:var(--eta); box-shadow:0 0 0 0 var(--eta); animation:pulse 2s infinite;} @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(21,122,69,.45);} 70%{box-shadow:0 0 0 8px rgba(21,122,69,0);} 100%{box-shadow:0 0 0 0 rgba(21,122,69,0);} }
  
  main{flex:1; padding:12px 24px 16px 24px; display:flex; flex-direction:column; min-height:0;} 
  .grid{ flex:1; display:grid; grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(2, 1fr); gap:12px; } @media (max-width:1400px){ .grid{grid-template-columns:repeat(3,1fr); grid-template-rows:auto;} } @media (max-width:1000px){ .grid{grid-template-columns:repeat(2,1fr); grid-template-rows:auto;} } @media (max-width:640px){ .grid{grid-template-columns:1fr; grid-template-rows:auto;} }
  
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:12px 14px; display:flex; flex-direction:column; justify-content:flex-start; gap:8px; border-top:3px solid var(--brand); height:100%; min-height:0; overflow:hidden; } 
  .card-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px;} 
  .vessel-name{ font-family:'Archivo', sans-serif; font-weight:800; font-size:17.5px; color:var(--ink); text-wrap:balance; } 
  .voy{ font-family:'IBM Plex Mono', monospace; font-size:17px; font-weight:700; color:var(--ink); white-space:nowrap; }
  
  .route{ font-size:13.5px; color:var(--ink-soft); font-weight:500; display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height: 20px;} 
  .route b{color:var(--ink); font-weight:600;} .route .arrow{color:var(--brand); font-weight:700;}
  
  /* CỐ ĐỊNH KÍCH THƯỚC LAYCAN 115px, CARGO TỰ ĐỘNG GIÃN */
  .meta-row{ display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--ink-soft); align-items: center; min-height: 24px;} 
  .meta-row .chip{ background:var(--surface-alt); border:1px solid var(--line); border-radius:6px; padding:2px 8px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } 
  .meta-row .cargo-chip { flex: 1; } /* Tự động giãn chiếm không gian còn lại */
  .meta-row .laycan-chip { flex: 0 0 120px; text-align: left; } /* Cố định độ rộng 115px để luôn bằng nhau */
  .meta-row .chip b{color:var(--ink); font-weight:600;} 
  
  .rob-row{ display:flex; flex-wrap:nowrap; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--ink-soft); background:var(--surface-alt); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-height: 36px; }
  .rob-label{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-right:2px; } 
  .rob-val{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:12.5px; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap; } 
  .rob-val b{color:var(--brand); font-weight:700;} 
  .rob-val.rob-low{ background:var(--etd-bg); color:var(--etd); border-radius:5px; padding:2px 6px; } 
  .rob-val.rob-low b{color:var(--etd);} 
  
  .timeline{ flex:1; margin-top:2px; padding-top:8px; border-top:1px dashed var(--line); display:flex; flex-direction:column; justify-content:flex-start; gap:5px; overflow:hidden; } 
  .tl-row{display:flex; align-items:flex-start; gap:8px;} 
  .tl-time{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; font-weight:500; color:var(--ink-soft); min-width:110px; font-variant-numeric:tabular-nums; white-space:nowrap; padding-top:2px; } 
  
  .tl-status{ font-size:13.5px; font-weight:700; padding:4px 10px; border-radius:6px; display:inline-flex; align-items:center; gap:6px; line-height:1.3; } 
  .st-eta{color:var(--eta); background:var(--eta-bg);} 
  .st-etd{color:var(--etd); background:var(--etd-bg);} 
  .st-arrived{color:var(--arrived); background:var(--arrived-bg);} 
  .st-pob{color:var(--pob); background:var(--pob-bg);} 
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 140 51" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    </svg>
    <div class="brand-text">
      <span class="eyebrow">Aulac Corporation &middot; Energy on the move</span>
      <span class="title">Fleet Position</span>
    </div>
  </div>
  
  <div class="header-right">
    <span class="live-pill"><span class="live-dot"></span>LIVE</span>
    <span id="clock">--/--/---- | --:--:--</span>
  </div>
</header>
<main><div class="grid" id="fleet-grid"></div></main>

<script>
  const FLEET = [{"name":"Aulac Diamond","voy":"ADM-2526","cargo":"9,000 MT Alkylate","route":["Mailiao","Singapore"],"laycan":"09-11/09","rob":{"fo":"192.3","do":"41.5","fw":"392"},"timeline":[{"time":"09 Sep/1700 LT","label":"ETA Mailiao P/S","type":"eta"}]},{"name":"Aulac Conifer","voy":"ACF-2126","cargo":"&mdash;","route":["Singapore","PEBGC"],"laycan":"","rob":{"fo":"394.5","do":"21.1","fw":"130"},"timeline":[{"time":"11 Sep/1000 LT","label":"ETA PEBGC Singapore","type":"eta"}]},{"name":"Aulac Vision","voy":"AVS-2126","cargo":"Gasoil (DO)","route":["Nghi Sơn","VK102 Nhà Bè"],"laycan":"12-14/09","rob":{"fo":"310.4","do":"37.7","fw":"138"},"timeline":[{"time":"08 Sep/0449 LT","label":"Departed Vũng Tàu P/S","type":"etd"},{"time":"11 Sep/0700 LT","label":"ETA Nghi Sơn P/S","type":"eta"}]},{"name":"Aulac Bella","voy":"ABL-2426","cargo":"12,000 m³ Mogas 92R","route":["Nhà Bè","Nghi Sơn"],"laycan":"07-09/09","rob":{"fo":"336.0","do":"25.5","fw":"220"},"timeline":[{"time":"07 Sep/0100 LT","label":"ETD Nhà Bè (departed)","type":"etd"},{"time":"09 Sep/1500 LT","label":"ETA Nghi Sơn P/S","type":"eta"}]},{"name":"Aulac Eagle","voy":"AEG-2826","cargo":"Mogas E10 &amp; Diesel","route":["Dung Quất","Phước Khánh"],"laycan":"","rob":{"fo":"51.8","do":"21.2","fw":"270"},"timeline":[{"time":"07 Sep/1705 LT","label":"ETD Dung Quất (departed)","type":"etd"},{"time":"09 Sep/1100 LT","label":"ETA Vũng Tàu P/S","type":"eta"}]},{"name":"Aulac Aurora","voy":"AAR-2026","cargo":"15,000 MT Jet A-1","route":["Maptaphut","Batangas"],"laycan":"10-12/09","rob":{"fo":"269.7","do":"48.8","fw":"239"},"timeline":[{"time":"07 Sep/1203 LT","label":"Departed Sihanoukville","type":"etd"},{"time":"08 Sep/0436 LT","label":"Arrived Maptaphut anchorage","type":"arrived"}]},{"name":"Aulac Sirius","voy":"ASR-2426","cargo":"5-10 KT Jet A-1","route":["Singapore","Sriracha"],"laycan":"","rob":{"fo":"474.1","do":"74.5","fw":"95"},"timeline":[{"time":"07 Sep/2200 LT","label":"Arrived Sriracha anchorage","type":"arrived"},{"time":"08 Sep/1400 LT","label":"NOR Tendered","type":"pob"}]},{"name":"Aulac Mission","voy":"AMS-2126","cargo":"79KB Gasoil 10ppm","route":["SRC Singapore","Cái Mép"],"laycan":"10-12/09","rob":{"fo":"537.5","do":"69.9","fw":"286"},"timeline":[{"time":"10 Sep/0500 LT","label":"ETA Vũng Tàu P/S","type":"eta"}]}];

  function renderFleet(){
    const grid = document.getElementById('fleet-grid');
    grid.innerHTML = FLEET.map(v => `
      <article class="card">
        <div class="card-head">
          <span class="vessel-name">${v.name}</span>
          <span class="voy">${v.voy}</span>
        </div>
        <div class="route">
          <b>${v.route[0]}</b>${v.route[1] ? `<span class="arrow">&#8594;</span><b>${v.route[1]}</b>` : ''}
        </div>
        
        <div class="meta-row">
          <span class="chip cargo-chip"><b>Cargo</b> ${v.cargo || '&mdash;'}</span>
          <span class="chip laycan-chip"><b>Laycan</b> ${v.laycan || '&mdash;'}</span>
        </div>
        
        ${v.rob ? `
        <div class="rob-row">
          <span class="rob-label">ROB</span>
          <span class="rob-val${parseFloat(v.rob.fo) < 200 ? ' rob-low' : ''}">FO <b>${v.rob.fo}</b> MT</span>
          <span class="rob-val">DO <b>${v.rob.do}</b> MT</span>
          <span class="rob-val">FW <b>${v.rob.fw}</b> MT</span>
        </div>` : ''}
        
        <div class="timeline">
          ${v.timeline.map(t => `
            <div class="tl-row">
              <span class="tl-time">${t.time}</span>
              <span class="tl-status st-${t.type}">${t.label}</span>
            </div>
          `).join('')}
        </div>
      </article>
    `).join('');
  }
  
  renderFleet();
  function updateClock(){ const n = new Date(); const d = String(n.getDate()).padStart(2,'0'); const m = String(n.getMonth()+1).padStart(2,'0'); const y = n.getFullYear(); document.getElementById('clock').textContent = `${d}/${m}/${y} | ${n.toLocaleTimeString('vi-VN')}`; }
  updateClock(); setInterval(updateClock, 1000);
</script>
</body>
</html>
