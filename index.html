bel":"09/09/2026 11:20 giờ tàu (GMT+8)","sourceSubject":"AULAC MISSION / AMS-2226 / 10-12 SEP 2026/ LOADING 100KB +/-5% GASOLINE 92 RON UNLEADED @ADVARIO, SINGAPORE/ ETA TO SINGAPORE REPORT","freshLabel":"Mới","freshClass":"fresh"},"timeline":[{"time":"06 Sep/2013 LT","label":"NOR Tendered / POB","type":"pob"},{"time":"06 Sep/2013 LT","label":"Arrived","type":"arrived"},{"time":"06 Sep/2013 LT","label":"All Fast","type":"allfast"},{"time":"07 Sep/0915 LT","label":"ETA Updated","type":"eta"}]}];

  // Port nguyên từ artifact "Aulac Fleet Console" (VESSEL_COLORS/STATUS_COLORS), giữ đúng bảng màu.
  const VESSEL_COLORS = {
    ADM:{bg:'#002060',fg:'#ffffff'}, ACF:{bg:'#fabf8f',fg:'#101a24'}, AVS:{bg:'#0070c0',fg:'#ffffff'},
    ABL:{bg:'#ffc000',fg:'#101a24'}, AEG:{bg:'#cc6600',fg:'#ffffff'}, AAR:{bg:'#dfe1e3',fg:'#101a24'},
    ASR:{bg:'#4f6128',fg:'#ffffff'}, AMS:{bg:'#d6e3bc',fg:'#101a24'}
  };
  const STATUS_COLORS = {
    'Done':{bg:'#d8d8d8',fg:'#000000'}, 'Perform':{bg:'#ffcc00',fg:'#000000'}, 'Lifted':{bg:'#00b0f0',fg:'#000000'},
    'Onsub':{bg:'#00cc66',fg:'#000000'}, 'Offer':{bg:'#dbe5f1',fg:'#000000'}, 'Open':{bg:'#ff6600',fg:'#000000'},
    'Release':{bg:'#ffc7ce',fg:'#9c0006'}, 'Cancel':{bg:'#ffc7ce',fg:'#9c0006'}, 'Working':{bg:'#b4a7d6',fg:'#2c2350'},
    'Fail Sub':{bg:'#e59797',fg:'#7a1014'}
  };

  function statusPillHtml(status){
    const c = STATUS_COLORS[status];
    if(!c) return `<span class="status-pill" style="background:var(--surface-alt);color:var(--ink-soft)">${status||'—'}</span>`;
    return `<span class="status-pill" style="background:${c.bg};color:${c.fg}">${status}</span>`;
  }

  // Port nguyên công thức đếm ngược ETA từ artifact (etaChipHtml) — tính LẠI mỗi lần trang được xem/refresh,
  // dựa trên đồng hồ thật của người xem, không phải thời điểm script chạy.
  function etaChipHtml(iso){
    if(!iso) return '<span class="eta-chip e-none">—</span>';
    const eta = new Date(iso);
    if(isNaN(eta)) return '<span class="eta-chip e-none">—</span>';
    const diffH = (eta.getTime() - Date.now()) / 3600000;
    let cls, label;
    if(diffH < 0){ cls='e-past'; label='Đã qua ETA'; }
    else if(diffH < 24){ cls='e-soon'; const h=Math.round(diffH); label=`Còn ${h}h`; }
    else { cls='e-future'; const d=Math.floor(diffH/24), h=Math.round(diffH%24); label=`Còn ${d}n ${h}h`; }
    return `<span class="eta-chip ${cls}">${label}</span>`;
  }

  function fmtRob(n){ const num = parseFloat(n); return isNaN(num) ? '—' : num.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}); }

  // Port nguyên logic noonBlockHtml (3 trạng thái underway/waiting_berth/working + cảnh báo FO<200MT),
  // cộng thêm nhãn "Mới/Cũ" (freshLabel/freshClass, tính sẵn ở phía Apps Script) mà bản gốc không có.
  function noonBlockHtml(v){
    const nr = v.pos;
    if(!nr) return '<div class="noon-empty">Chưa có Noon Report</div>';
    let destLine, chip, portLine = '';
    if(nr.status === 'working'){
      destLine = `Đang làm hàng (Alongside) <b>${nr.currentPort||'—'}</b>`;
      chip = '<span class="eta-chip e-soon">Làm hàng</span>';
      portLine = `<div class="noon-port">Allfast ${nr.allfastLabel||'—'} &middot; ETC ${nr.etcLabel||'tbr'} &middot; ETD ${nr.etdLabel||'tbr'}</div>`;
    } else if(nr.status === 'waiting_berth'){
      destLine = `Chờ cầu (Anchorage) <b>${nr.currentPort||'—'}</b>`;
      chip = '<span class="eta-chip e-none">Chờ cầu</span>';
      portLine = `<div class="noon-port">ARR ${nr.arrLabel||'—'} &middot; ETB ${nr.etbLabel||'tbr'}</div>`;
    } else {
      destLine = `&rarr; <b>${nr.destPort||'—'}</b>${nr.etaLabel? ' &middot; ETA '+nr.etaLabel : ''}`;
      chip = etaChipHtml(nr.etaIso);
    }
    const rob = v.rob || {};
    const foLow = parseFloat(rob.fo) < 200;
    const foWarn = foLow ? '<div class="fo-warn">FO thấp (dưới 200 MT) — xem xét cần cấp dầu</div>' : '';
    const freshTag = nr.freshLabel ? ` &middot; <span class="fresh-${nr.freshClass}">${nr.freshLabel}</span>` : '';
    return `<div class="noon-block" title="${(nr.sourceSubject||'').replace(/"/g,'&quot;')}">
      <div class="noon-head"><span class="noon-label">Noon Report</span><span class="noon-time">${nr.reportLabel||'—'}${freshTag}</span></div>
      <div class="noon-dest">${destLine} ${chip}</div>
      ${portLine}
      <div class="rob-line"><span class="${foLow?'rob-low':''}">FO<b>${fmtRob(rob.fo)}</b></span><span>DO<b>${fmtRob(rob.do)}</b></span><span>FW<b>${fmtRob(rob.fw)}</b></span></div>
      ${foWarn}
    </div>`;
  }

  function renderFleet(){
    const grid = document.getElementById('fleet-grid');
    grid.innerHTML = FLEET.map(v => {
      const code = v.voy.split('-')[0];
      const vc = VESSEL_COLORS[code];
      return `
      <article class="card" style="border-left-color:${vc?vc.bg:'var(--line)'}">
        <div class="card-head">
          <span class="vessel-name">${vc?`<span class="v-dot" style="background:${vc.bg}"></span>`:''}${code} &middot; ${v.name}</span>
          <span class="voy">${v.voy}</span>
        </div>

        ${statusPillHtml(v.voyStatus)}

        <div class="route">
          <b>${v.route[0]||'—'}</b>${v.route[1] ? `<span class="arrow">&#8594;</span><b>${v.route[1]}</b>` : ''}
        </div>

        <div class="chtr-line">${v.charterer||''}${v.charterer&&v.laycan?' &middot; ':''}${v.laycan?'Laycan '+v.laycan:''}</div>

        ${noonBlockHtml(v)}

        <div class="timeline">
          ${v.timeline.map(t => `
            <div class="tl-row">
              <span class="tl-time">${t.time}</span>
              <span class="tl-status st-${t.type}">${t.label}</span>
            </div>
          `).join('')}
        </div>
      </article>
    `;
    }).join('');
  }

  renderFleet();
  function updateClock(){ const n = new Date(); const d = String(n.getDate()).padStart(2,'0'); const m = String(n.getMonth()+1).padStart(2,'0'); const y = n.getFullYear(); document.getElementById('clock').textContent = `${d}/${m}/${y} | ${n.toLocaleTimeString('vi-VN')}`; }
  updateClock(); setInterval(updateClock, 1000);
  // Đếm ngược ETA (etaChipHtml) tự tính lại theo đồng hồ người xem mỗi khi renderFleet() chạy — vẽ lại toàn bộ
  // fleet-grid mỗi phút để badge "Còn Xh" luôn khớp, không cần đợi trang tự refresh sau 20 phút.
  setInterval(renderFleet, 60000);
</script>
