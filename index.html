  // Port nguyên từ artifact "Aulac Fleet Console" (VESSEL_COLORS/STATUS_COLORS), giữ đúng bảng màu.
  const VESSEL_COLORS = {
    ADM:{bg:'#002060',fg:'#ffffff'}, ACF:{bg:'#fabf8f',fg:'#101a24'}, AVS:{bg:'#0070c0',fg:'#ffffff'},
    ABL:{bg:'#ffc000',fg:'#101a24'}, AEG:{bg:'#cc6600',fg:'#ffffff'}, AAR:{bg:'#dfe1e3',fg:'#101a24'},
    ASR:{bg:'#4f6128',fg:'#ffffff'}, AMS:{bg:'#d6e3bc',fg:'#101a24'}
  };
  const STATUS_COLORS = {
    'Done':{bg:'#d8d8d8',fg:'#000000'}, 'Perform':{bg:'#ffcc00',fg:'#000000'}, 'Lifted':{bg:'#00b0f0',fg:'#000000'},
    'Onsub':{bg:'#00cc66',fg:'#000000'}, 'Offer':{bg:'#dbe5f1',fg:'#000000'}, 'Open':{bg:'#ff6600',fg:'#000000'},
    'Release':{bg:'#ffc7ce',fg:'#9c0006'}, 'Cancel':{bg:'#ffc7ce',fg:'#9c0006'}, 'Working':{bg:'#b4a7d6',fg:'#2c2350'},
    'Fail Sub':{bg:'#e59797',fg:'#7a1014'}
  };

  function esc(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function statusPillHtml(status){
    const c = STATUS_COLORS[status];
    if(!c) return `<span class="status-pill" style="background:var(--surface-alt);color:var(--ink-soft)">${esc(status)||'—'}</span>`;
    return `<span class="status-pill" style="background:${c.bg};color:${c.fg}">${esc(status)}</span>`;
  }

  // Port nguyên công thức đếm ngược ETA từ artifact (etaChipHtml) — tính LẠI mỗi lần trang được xem/refresh,
  // dựa trên đồng hồ thật của người xem, không phải thời điểm script chạy.
  function etaChipHtml(iso){
    if(!iso) return '';
    const eta = new Date(iso);
    if(isNaN(eta)) return '';
    const diffH = (eta.getTime() - Date.now()) / 3600000;
    let cls, label;
    if(diffH < 0){ cls='e-past'; label='Đã qua ETA'; }
    else if(diffH < 24){ cls='e-soon'; const h=Math.round(diffH); label=`Còn ${h}h`; }
    else { cls='e-future'; const d=Math.floor(diffH/24), h=Math.round(diffH%24); label=`Còn ${d}n ${h}h`; }
    return `<span class="eta-chip ${cls}">${label}</span>`;
  }

  function fmtRob(n){ return (n===null||n===undefined) ? '—' : Number(n).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}); }

  // noonBlockHtml — port nguyên 4 nhánh trạng thái từ Console (working / waiting_berth / underway / khác-chưa-phân-loại),
  // vì noon_reports của Console đã có sẵn location_label/current_port/dest_port/eta/arr_label/allfast_label/etc_label/etd_label...
  function noonBlockHtml(code, nr){
    if(!nr) return '<div class="noon-empty">Chưa có Noon Report</div>';
    let destLine, chip, portLine = '';
    if(nr.status === 'working'){
      destLine = `${esc(nr.location_label||'Alongside')} <b>${esc(nr.current_port||'—')}</b>`;
      chip = '<span class="eta-chip e-soon">Làm hàng</span>';
      portLine = `<div class="noon-port">Allfast ${esc(nr.allfast_label)||'—'} &middot; ETC ${esc(nr.etc_label)||'tbr'} &middot; ETD ${esc(nr.etd_label)||'tbr'}</div>`;
    } else if(nr.status === 'waiting_berth'){
      destLine = `${esc(nr.location_label||'Chờ cầu')} <b>${esc(nr.current_port||'—')}</b>`;
      chip = '<span class="eta-chip e-none">Chờ cầu</span>';
      portLine = `<div class="noon-port">ARR ${esc(nr.arr_label)||'—'} &middot; ETB ${esc(nr.etb_label)||'tbr'}</div>`;
    } else if(nr.status !== 'underway'){
      destLine = `${esc(nr.location_label||'Alongside')} <b>${esc(nr.current_port||'—')}</b>`;
      chip = '<span class="eta-chip e-none">Tại cảng</span>';
    } else {
      destLine = `&rarr; <b>${esc(nr.dest_port||'—')}</b>${nr.eta_label ? ' &middot; ETA '+esc(nr.eta_label) : ''}`;
      chip = etaChipHtml(nr.eta) || '<span class="eta-chip e-none">—</span>';
    }
    const FO_LOW_MT = 200;
    const foLow = typeof nr.rob_fo === 'number' && nr.rob_fo < FO_LOW_MT;
    const foWarn = foLow ? `<div class="fo-warn">FO thấp (dưới ${FO_LOW_MT} MT) — xem xét cần cấp dầu</div>` : '';
    return `<div class="noon-block" title="${esc(nr.source_subject||'')}">
      <div class="noon-head"><span class="noon-label">Noon Report</span><span class="noon-time">${esc(nr.report_label)||'—'}</span></div>
      <div class="noon-dest">${destLine} ${chip}</div>
      ${portLine}
      <div class="rob-line"><span class="${foLow?'rob-low':''}">FO<b>${fmtRob(nr.rob_fo)}</b></span><span>DO<b>${fmtRob(nr.rob_do)}</b></span><span>FW<b>${fmtRob(nr.rob_fw)}</b></span></div>
      ${foWarn}
    </div>`;
  }

  function renderFleet(){
    const grid = document.getElementById('fleet-grid');
    grid.innerHTML = FLEET.map(v => {
      const vc = VESSEL_COLORS[v.code];
      return `
      <article class="card" style="border-left-color:${vc?vc.bg:'var(--line)'}">
        <div class="card-head">
          <span class="vessel-name">${vc?`<span class="v-dot" style="background:${vc.bg}"></span>`:''}${v.code} &middot; ${esc(v.name)}</span>
          <span class="voy">${esc(v.voy)}</span>
        </div>

        ${statusPillHtml(v.voyStatus)}

        <div class="route">
          <b>${esc(v.route[0])||'—'}</b>${v.route[1] ? `<span class="arrow">&#8594;</span><b>${esc(v.route[1])}</b>` : ''}
        </div>

        <div class="chtr-line">${esc(v.charterer)||''}${v.charterer&&v.laycan?' &middot; ':''}${v.laycan?'Laycan '+esc(v.laycan):''}</div>

        ${noonBlockHtml(v.code, v.pos)}
      </article>
    `;
    }).join('');
  }

  renderFleet();
  function updateClock(){ const n = new Date(); const d = String(n.getDate()).padStart(2,'0'); const m = String(n.getMonth()+1).padStart(2,'0'); const y = n.getFullYear(); document.getElementById('clock').textContent = `${d}/${m}/${y} | ${n.toLocaleTimeString('vi-VN')}`; }
  updateClock(); setInterval(updateClock, 1000);
  // Đếm ngược ETA (etaChipHtml) tự tính lại theo đồng hồ người xem mỗi khi renderFleet() chạy — vẽ lại toàn bộ
  // fleet-grid mỗi phút để badge "Còn Xh" luôn khớp, không cần đợi trang tự refresh sau 20 phút.
  setInterval(renderFleet, 60000);
</script>
